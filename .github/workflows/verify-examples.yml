name: verify examples workflow

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  bazel-tests:
    name: Bazel Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install Bazel
        run: |
          sudo apt-get update
          sudo apt-get install -y bazel

      - name: Run Bazel tests
        run: |
          # Assumes BUILD files are configured under examples/
          bazel test //examples/...

  cmake-tests:
    name: CMake Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Install CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake

      - name: Build and Test CMake Examples
        run: |
          # Loop over all immediate subdirectories under examples/
          for d in examples/*/ ; do
            if [ -f "$d/CMakeLists.txt" ]; then
              echo "Building CMake project in $d"
              mkdir -p "$d/build"
              pushd "$d/build"
              cmake ..
              cmake --build .
              ctest --output-on-failure || exit 1
              popd
            else
              echo "Skipping $d as no CMakeLists.txt found."
            fi
          done
